name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # Completely ignore submodules

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Manual Xcode Compilation
        run: |
          # Navigate straight to the iOS source folder
          cd iosApp
          
          # Force build using standard xcode tools without signing requirements
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package App Bundle into IPA
        run: |
          mkdir -p Payload
          # Find the compiled .app file and copy it over
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            # Fallback check inside the local folder
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_DIR" ]; then
            echo "Error: Could not locate compiled .app file."
            exit 1
          fi
          
          cp -R "$APP_DIR" Payload/
          zip -r Nuvio.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
