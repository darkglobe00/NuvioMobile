name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Pre-build Kotlin Multiplatform Framework
        run: |
          chmod +x gradlew
          # This forces Kotlin to compile the shared codebase into an iOS framework first
          ./gradlew :composeApp:compileKotlinIosX64 --no-daemon
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon

      - name: Compile Xcode Project
        run: |
          cd iosApp
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App Bundle into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "Error: Could not locate compiled .app file."
            exit 1
          fi
          cp -R "$APP_DIR" Payload/
          zip -r Nuvio.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
