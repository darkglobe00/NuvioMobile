name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Specifically use standard M-series Mac runners
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Fetch hidden submodules cleanly

      - name: Fix Safe Directory Permissions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Official Build Script
        run: |
          chmod +x ./scripts/build-distribution.sh
          ./scripts/build-distribution.sh

      - name: Search and Package IPA
        run: |
          # Finds the compiled app file wherever the script drops it
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No compiled build bundle found."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Nuvio.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio.ipa
